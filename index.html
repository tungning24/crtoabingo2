	<script>
	if ("serviceWorker" in navigator) {
	  window.addEventListener("load", () => {
		// ใส่ชื่อโฟลเดอร์โปรเจกต์ของคุณนำหน้า
		navigator.serviceWorker.register("/crtoabingo2/sw.js", { scope: "/crtoabingo2/" })
		  .then((reg) => {
			console.log("Service Worker Registered for scope: ", reg.scope);
		  })
		  .catch((error) => {
			console.error("Registration failed: ", error);
		  });
	  });
	}
	</script>

        <h1>CRToA Bingo</h1>
    </main>
